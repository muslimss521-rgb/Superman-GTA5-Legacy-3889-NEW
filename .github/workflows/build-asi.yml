name: Build Superman ASI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check ScriptHookV.lib
        shell: cmd
        run: |
          if not exist ScriptHookV.lib (
            echo ERROR: ScriptHookV.lib not found
            exit /b 1
          )
          echo ScriptHookV.lib found

      - name: Build
        shell: cmd
        run: |
          cl /LD /EHsc /std:c++17 ^
            /I include ^
            src\main.cpp ^
            src\Superman\Superman.cpp ^
            src\Abilities\Flight.cpp ^
            /link ScriptHookV.lib User32.lib /OUT:Superman.dll

      - name: Rename ASI
        shell: cmd
        run: |
          ren Superman.dll Superman.asi

      - name: Upload Superman.asi
        uses: actions/upload-artifact@v4
        with:
          name: Superman-ASI
          path: Superman.asi
